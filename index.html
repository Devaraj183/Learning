<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top">
        <div class="SMS">
            Student Management System
        </div>
        <div class="Modules">
            <a href="#" id="dash">Dashboard</a>
            <a href="#" id="add-st">Add Student</a>
            <a href="#" id="st-list">Studets List</a>
        </div> 
    </nav>
    <div class="Main">
        <section class="dashboard">
            <div class="d-same Total">
                <h3>Totals Students</h3>
                <h1>0+</h1>
            </div>
            <div class="d-same Average">
                <h3>Average Mark</h3>
                <h1>0</h1>
            </div>
            <div class="d-same Highest">
                <h3>Highest Mark</h3>
                <h1>0</h1>
            </div>
            <div class="d-same Lowest">
                <h3>Lowest Mark</h3>
                <h1>0</h1>
            </div>
        </section>
        <section class="AddSt">
            <form class="st-form">
                <h2 class="tittles">Enter Your Details</h2>
                <div class="form1">
                    <div><label><p>Enter Your Name : </p><input type="text" placeholder="Enter Your Name"><p class="error">name error</p></label></div>
                    <div><label><p>Enter Your Email : </p><input type="email" placeholder="Enter Your Email" ><p class="error">email error</p></label></div>
                    <div><label><p>Enter Your Age</p><input type="number" placeholder="Enter Your Age" min="1" max="100"><p class="error">age error</p></label></div>
                    <div><label>
                        <p>Enter Your Department : </p>
                        <select id="dept">
                            <option>Others</option>
                            <option value="">AIDS</option>
                            <option value="">CSE</option>
                            <option value="">IT</option>
                            <option value="">ECE</option>
                            <option value="">EEE</option>
                            <option value="">AIML</option>
                            <option value="">EEE</option>
                            <option value="">BIO TECH</option>
                            <option value="">BIO MEDICAL</option>
                            <option value="">CIVIL</option>
                            <option value="">CCE</option>
                            <option value="">MECH</option>
                        </select></label>
                    </div>
                    <h2 class="tittles">Marks</h2>               
                    <div><label><p>Subject 1: </p><input type="number" min="0" max="100"><p class="error">mark error</p></label></div>
                    <div><label><p>Subject 2: </p><input type="number" min="0" max="100"><p class="error">mark error</p></label></div>
                    <div><label><p>Subject 3: </p><input type="number" min="0" max="100"><p class="error">mark error</p></label></div>
                    <div><label><p>Subject 4: </p><input type="number" min="0" max="100"><p class="error">mark error</p></label></div>
                    <div><label><p>Subject 5: </p><input type="number" min="0" max="100"><p class="error">mark error</p></label></div>          
                </div>
            </form>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
